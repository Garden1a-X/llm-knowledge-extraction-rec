name: beauty_test
description: Quick test config for Beauty dataset (1 epoch, small batch)

data:
  item_kg_path: data/recbole/amazon-beauty/amazon-beauty.item.kg
  user_kg_path: data/recbole/amazon-beauty/amazon-beauty.user.kg
  inter_path: data/recbole/amazon-beauty/amazon-beauty.inter
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  time_based_split: true
  per_user_split: true
  min_rating: 4.0

model:
  embedding_dim: 64
  num_gnn_layers: 2
  gat_heads: 4
  dropout: 0.2
  use_mask: true
  mask_min_freq: 5
  mask_max_freq: 1000

loss:
  alpha_contrast: 0.1
  beta_align: 0.05
  gamma_mask: 0.01
  temperature_rec: 0.2
  temperature_contrast: 0.1
  lambda_sparse: 1.0
  lambda_entropy: 0.1
  num_neg_align: 5

train:
  batch_size: 512  # Smaller batch for quick test
  num_negatives: 1
  learning_rate: 0.001
  weight_decay: 0.00001
  num_epochs: 1  # Only 1 epoch for testing
  early_stop_patience: 1000  # Disabled (not relevant for 1-epoch test)
  eval_every: 1
  eval_mode: full  # Full evaluation (Beauty has only 58 items)
  log_every: 1
  save_every: 1
  num_workers: 4
  device: cuda
  random_seed: 42

ablation:
  use_contrast: true
  use_align: true
  use_mask: true
  use_cf_view: true
  use_kg_view: true

output_dir: outputs
checkpoint_dir: checkpoints
