# BPR Baseline Configuration for Amazon Beauty
# BPR: Bayesian Personalized Ranking (UAI 2009)
# Classic collaborative filtering baseline without using KG

# Data
dataset: amazon-beauty
data_path: data/recbole

# Model
model: BPR
embedding_size: 64
reg_weight: 0.00001

# Training
epochs: 300
train_batch_size: 2048
eval_batch_size: 4096
learning_rate: 0.001

# Evaluation
stopping_step: 1000  # Disable early stopping (Beauty dataset too small, let it train fully)
eval_step: 1
metrics: ['Recall', 'NDCG', 'Precision', 'Hit']
topk: [10, 20]
valid_metric: NDCG@10

# Data Split (aligned with our config)
eval_args:
  split:
    RS: [0.7, 0.1, 0.2]  # Per-user Random Split
  order: TO  # Time-based ordering
  mode: full  # Full evaluation (Beauty has only 58 items, too small for uni100)

# Other
load_col:
  inter: ['user_id', 'item_id', 'rating', 'timestamp']

seed: 42
gpu_id: '0'
