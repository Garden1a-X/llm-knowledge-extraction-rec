name: beauty_full
description: Full model with all components on Amazon Beauty dataset

data:
  item_kg_path: data/recbole/amazon-beauty/amazon-beauty.item.kg
  user_kg_path: data/recbole/amazon-beauty/amazon-beauty.user.kg
  inter_path: data/recbole/amazon-beauty/amazon-beauty.inter
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  time_based_split: true
  per_user_split: true  # Per-user Random Split (aligned with RecBole RS)
  min_rating: 4.0

model:
  embedding_dim: 64
  num_gnn_layers: 2
  gat_heads: 4
  dropout: 0.2
  use_mask: true
  mask_min_freq: 5
  mask_max_freq: 1000

loss:
  alpha_contrast: 0.1
  beta_align: 0.05
  gamma_mask: 0.01
  temperature_rec: 0.2
  temperature_contrast: 0.1
  lambda_sparse: 1.0
  lambda_entropy: 0.1
  num_neg_align: 5

train:
  batch_size: 2048  # Aligned with RecBole BPR
  num_negatives: 1
  learning_rate: 0.001
  weight_decay: 0.00001
  num_epochs: 300
  early_stop_patience: 10  # Aligned with RecBole stopping_step
  eval_every: 1  # Evaluate every epoch (aligned with RecBole eval_step=1)
  eval_mode: full  # Full evaluation (Beauty has only 58 items, too small for uni100)
  eval_num_neg: 99  # Not used in full mode
  log_every: 1
  save_every: 10
  num_workers: 4
  device: cuda
  random_seed: 42

ablation:
  use_contrast: true
  use_align: true
  use_mask: true
  use_cf_view: true
  use_kg_view: true

output_dir: outputs
checkpoint_dir: checkpoints
