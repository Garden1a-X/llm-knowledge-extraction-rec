name: tune3_depth_dropout
description: Hyperparameter Tuning - Focus on model depth and regularization

data:
  item_kg_path: data/recbole/ml-1m/ml-1m.item.kg
  user_kg_path: data/recbole/ml-1m/ml-1m.user.kg
  inter_path: data/recbole/ml-1m/ml-1m.inter
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  time_based_split: true
  per_user_split: true
  min_rating: 4.0

model:
  embedding_dim: 64
  # TUNED: Deeper model with more GNN layers
  num_gnn_layers: 3    # 原来: 2
  # TUNED: More attention heads for better multi-head attention
  gat_heads: 8         # 原来: 4
  # TUNED: Higher dropout to prevent overfitting with deeper model
  dropout: 0.3         # 原来: 0.2
  use_mask: true
  mask_min_freq: 5
  mask_max_freq: 1000

loss:
  alpha_contrast: 0.1
  beta_align: 0.05
  gamma_mask: 0.01
  temperature_rec: 0.2
  temperature_contrast: 0.1
  lambda_sparse: 1.0
  lambda_entropy: 0.1
  num_neg_align: 5

train:
  batch_size: 2048
  num_negatives: 1
  learning_rate: 0.001
  # TUNED: Higher weight decay for deeper model
  weight_decay: 0.0001  # 原来: 0.00001
  num_epochs: 300
  early_stop_patience: 10
  eval_every: 1
  log_every: 1
  save_every: 10
  num_workers: 4
  device: cuda
  random_seed: 44  # Different seed

ablation:
  use_contrast: true
  use_align: true
  use_mask: true
  use_cf_view: true
  use_kg_view: true

output_dir: outputs
checkpoint_dir: checkpoints
